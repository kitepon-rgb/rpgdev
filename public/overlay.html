<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RPGDev Overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body data-phase="idle">
    <main class="overlay">
      <img id="sceneBg" class="bg" src="/assets/town.png" alt="" />
      <div class="shade"></div>
      <audio id="fieldAudio" src="/audio/field.wav" loop preload="auto"></audio>
      <audio id="adventureAudio" src="/audio/adventure.wav" loop preload="auto"></audio>
      <audio id="battleAudio" src="/audio/battle.wav" loop preload="auto"></audio>
      <audio id="dungeonAdventureAudio" src="/audio/dungeon-adventure.wav" loop preload="auto"></audio>
      <audio id="dungeonBattleAudio" src="/audio/dungeon-battle.wav" loop preload="auto"></audio>
      <audio id="castleAdventureAudio" src="/audio/castle-adventure.wav" loop preload="auto"></audio>
      <audio id="castleBattleAudio" src="/audio/castle-battle.wav" loop preload="auto"></audio>

      <header class="bar">
        <div class="titlebar">
          <span class="brand">RPGDev</span>
          <strong id="phaseLabel">Town</strong>
        </div>
        <div class="buttons">
          <button id="audioButton" type="button" title="BGM">♪</button>
        </div>
      </header>

      <div id="roster" class="roster" data-active="false" aria-hidden="true"></div>

      <section class="stage">
        <div class="hero" aria-hidden="true">
          <img id="heroImage" src="/assets/sprites/hero.png" alt="" />
        </div>
        <div id="allies" class="allies" data-active="false" aria-hidden="true"></div>
        <div id="monsterStage" class="monster" data-active="false" data-dying="false" aria-hidden="true">
          <div class="enemy-status">
            <span id="monsterName"></span>
          </div>
          <img id="monsterImage" src="/assets/sprites/slime.png" alt="" />
        </div>
        <canvas id="fxCanvas" width="1024" height="768"></canvas>
        <div id="toast" class="toast" aria-hidden="true"></div>
      </section>

      <!-- 戦闘→探検の全画面トランジション（要件5）。タイトル一枚絵＋テキストが右上→中央静止→左下へ抜ける。 -->
      <div id="sceneTransition" class="scene-transition" data-active="false" aria-hidden="true" hidden>
        <div class="scene-transition-art"></div>
        <div class="scene-transition-veil"></div>
        <span class="scene-transition-text"></span>
      </div>
    </main>
    <script type="module" src="/overlay.js"></script>
  </body>
</html>
